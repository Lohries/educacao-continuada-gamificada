# Broker MQTT do laboratorio (ADR-005)
listener 1883
# Laboratorio: sem autenticacao. Antes de producao: TLS (8883), credencial por
# dispositivo e ACL restringindo cada um ao seu topico (ver ADR-005).
allow_anonymous true

# Sessoes persistentes e mensagens QoS 1 sobrevivem ao restart do broker
persistence true
persistence_location /mosquitto/data/
autosave_interval 10
max_queued_messages 10000
