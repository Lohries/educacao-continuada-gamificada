spring:
  application:
    name: educacao-continuada-gamificada
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # buckets para calcular p95/p99 no Prometheus (gatilho de extracao do Ranking, ADR-001)
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,300ms,1s

# ia-service (ADR-003): timeout curto + circuit breaker; falha vira fallback
ia:
  url: ${IA_URL:http://localhost:8000}
  timeout-ms: ${IA_TIMEOUT_MS:1500}

resilience4j:
  circuitbreaker:
    instances:
      ia-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 6
        minimum-number-of-calls: 3
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true

# Eventos de conclusao (ADR-004): reentrega dos eventos cujo consumidor falhou
notificacao:
  reprocessar-a-cada-ms: ${NOTIFICACAO_REPROCESSAR_MS:15000}
  reprocessar-apos-ms: 10000

# Endpoints de simulacao de falha do mini-lab; desligados por padrao
lab:
  habilitado: ${LAB_HABILITADO:false}
