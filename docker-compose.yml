services:
  postgres:
    image: postgres:16-alpine
    container_name: gamificacao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamificacao
      POSTGRES_USER: gamificacao
      POSTGRES_PASSWORD: gamificacao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamificacao -d gamificacao"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: gamificacao-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gamificacao.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamificacao-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: gamificacao
      DB_USER: gamificacao
      DB_PASSWORD: gamificacao
      IA_URL: http://ia-service:8000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # service_started, nao service_healthy: o Core sobe e opera mesmo com a IA fora (ADR-003)
      ia-service:
        condition: service_started

  ia-service:
    build:
      context: ./ia-service
    container_name: gamificacao-ia-service
    restart: unless-stopped
    ports:
      - "8000:8000"

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: gamificacao-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./iot/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  iot-gateway:
    build:
      context: ./iot
      dockerfile: gateway/Dockerfile
    container_name: gamificacao-iot-gateway
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      CORE_URL: http://backend:8080
    ports:
      - "9101:9101"
    depends_on:
      - mosquitto
      - backend

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: gamificacao-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./observabilidade/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observabilidade/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro

  grafana:
    image: grafana/grafana:11.3.1
    container_name: gamificacao-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/b1-evidencias.json
    ports:
      - "3000:3000"
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Variaveis VITE_* sao embutidas no bundle em tempo de build, por
        # isso vao como build arg (nao como environment de runtime).
        VITE_API_URL: http://localhost:8080
    container_name: gamificacao-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  mosquitto-data:
