# Coleta das metricas que sustentam as decisoes do B1 (ADR-006)
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  - job_name: ia-service
    static_configs:
      - targets: ["ia-service:8000"]
  - job_name: iot-gateway
    static_configs:
      - targets: ["iot-gateway:9101"]
