# Cada alerta valida um ASR; o nome diz qual decisao ele observa (ADR-006)
groups:
  - name: b1-asrs
    rules:
      - alert: ComponenteForaDoAr
        expr: up == 0
        for: 30s
        labels: {severidade: critica}
        annotations: {resumo: "{{ $labels.job }} nao responde ao Prometheus"}

      - alert: IaEmModoDegradado            # ASR-06 / ADR-003
        expr: sum(rate(ia_respostas_total{origem="fallback"}[1m])) > 0
        for: 30s
        labels: {severidade: aviso}
        annotations: {resumo: "Core respondendo recomendacoes pelo fallback local"}

      - alert: CircuitoIaAberto             # ASR-06 / ADR-003
        expr: resilience4j_circuitbreaker_state{name="ia-service",state="open"} == 1
        labels: {severidade: aviso}
        annotations: {resumo: "Circuit breaker do ia-service aberto"}

      - alert: EventosPendentesAcumulando   # ASR-10 / ADR-004
        expr: eventos_pendentes > 0
        for: 2m
        labels: {severidade: aviso}
        annotations: {resumo: "Consumidor de eventos falhando ha mais de 2 minutos"}

      - alert: RankingLento                 # ASR-02 / gatilho de extracao do ADR-001
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri=~"/api(/usuarios)?/ranking"}[5m]))) > 0.3
        for: 10m
        labels: {severidade: aviso}
        annotations: {resumo: "p95 do ranking acima de 300 ms: reavaliar extracao (ADR-001)"}
